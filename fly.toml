app = "osstrace-api"
primary_region = "iad"

[build]

[env]
  PORT = "5320"
  HOST = "0.0.0.0"
  SERVER_DB = "/data/server.db"
  TRUST_PROXY = "1"

[mounts]
  source = "osstrace_data"
  destination = "/data"

[http_service]
  internal_port = 5320
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
